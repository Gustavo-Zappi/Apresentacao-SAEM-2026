version: "3.8"
services:
  web:
    image: nginx:1.29-alpine
    networks:
      - traefik_public
    volumes:
      - /home/ubuntu/services/saem2026/www:/usr/share/nginx/html:ro
      - /home/ubuntu/services/saem2026/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        traefik.enable: "true"
        traefik.docker.network: traefik_public
        traefik.http.routers.saem2026.rule: "Host(`saem2026.meetoliver.com.br`)"
        traefik.http.routers.saem2026.entrypoints: websecure
        traefik.http.routers.saem2026.priority: "100"
        traefik.http.routers.saem2026.tls: "true"
        traefik.http.routers.saem2026.tls.certresolver: le
        traefik.http.routers.saem2026.service: saem2026-service
        traefik.http.services.saem2026-service.loadbalancer.server.port: "80"
networks:
  traefik_public:
    external: true
